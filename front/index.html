<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashscore - Hockey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <h1>Flashscore</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#">Футбол</a></li>
        <li><a href="#">Хоккей</a></li>
        <li><a href="#">Теннис</a></li>
        <li><a href="#">Баскетбол</a></li>
        <li><a href="#">Другие виды спорта</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="container">
      <div class="content-wrapper">  <!-- Новый блок -->
        <div class="content">
          <div class="sidebar">
            <h2>Sidebar</h2>
            <!-- Добавьте здесь контент для боковой панели -->
          </div>
          <div class="matches-container">
            <div class="matches-content">
              <section class="live-matches">
                <h2>Live Matches</h2>
                <div class="match-container">
                  <div class="match">
                    <div class="team">
                      <span class="team-name">Team A</span>
                      <span class="score">1</span>
                    </div>
                    <div class="team">
                      <span class="team-name">Team B</span>
                      <span class="score">0</span>
                    </div>
                  </div>
                  <div class="match">
                    <div class="team">
                      <span class="team-name">Team C</span>
                      <span class="score">2</span>
                    </div>
                    <div class="team">
                      <span class="team-name">Team D</span>
                      <span class="score">2</span>
                    </div>
                  </div>
                </div>
              </section>

              <section class="upcoming-matches">
                <h2>Upcoming Matches</h2>
                <div class="match-container">
                  <div class="match">
                    <div class="team">
                      <span class="team-name">Team E</span>
                    </div>
                    <div class="team">
                      <span class="team-name">Team F</span>
                    </div>
                    <span class="time">18:00</span>
                  </div>
                  <div class="match">
                    <div class="team">
                      <span class="team-name">Team G</span>
                    </div>
                    <div class="team">
                      <span class="team-name">Team H</span>
                    </div>
                    <span class="time">20:30</span>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2023 Flashscore</p>
  </footer>
</body>
</html>
